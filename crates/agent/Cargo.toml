[package]
name = "winstats-agent"
version = "0.2.0"
edition = "2021"
rust-version = "1.77"
description = "Broadcasts this machine's resource usage to winstats on the local network"
license = "MIT"
repository = "https://github.com/mgvs/winstats"
authors = ["Oleksandr Zhabotynskyi <alexlp@mgvs.org>"]
publish = false

[[bin]]
name = "winstats-agent"
path = "src/main.rs"

[dependencies]
winstats-proto = { path = "../proto" }
serde = { version = "=1.0.210", features = ["derive"] }
serde_json = "=1.0.128"
toml = "=0.8.19"
sysinfo = { version = "=0.33.1", default-features = false, features = ["system", "network", "disk", "component"] }
